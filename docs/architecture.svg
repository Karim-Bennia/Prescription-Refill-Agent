<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1300" viewBox="0 0 1400 1300" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">Prescription-refill agent architecture</title>
  <desc id="architecture-description">A React and TypeScript browser client, built with esbuild, uses a local Node proxy to the Node HTTP conversation API. The trusted server serializes sessions, binds verified patient identity, and orchestrates medication selection, deterministic clinical rules, and explicit pharmacy consent. Groq provides untrusted language interpretation only. The sole refill kernel revalidates authorization and clinical eligibility before submitting through the EHR adapter. Pharmacy changes have their own guarded consent workflow. Service adapters access the supplied EHR and pharmacy-directory mock using server-side credentials. In-memory state, unauthenticated caller ownership, and missing upstream idempotency remain limitations.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#27687e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="proposal-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#607c88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #173c4c; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
      .subtitle { font-size: 18px; fill: #526d79; }
      .group-title { font-size: 16px; font-weight: 700; letter-spacing: 1.2px; fill: #28697a; }
      .node-title { font-size: 21px; font-weight: 650; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #526d79; }
      .code { font-size: 14.5px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; fill: #3c6375; }
      .connector-label { font-size: 14px; font-weight: 600; fill: #326b7c; }
      .node { fill: #ffffff; stroke: #a8c8d4; stroke-width: 1.5; }
      .domain { fill: #f5fcfb; stroke: #8abdb8; stroke-width: 1.5; }
      .flow { fill: none; stroke: #27687e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .exchange { marker-start: url(#arrow); }
      .proposal { fill: none; stroke: #607c88; stroke-width: 2; stroke-dasharray: 6 6; marker-start: url(#proposal-arrow); marker-end: url(#proposal-arrow); }
    </style>
  </defs>

  <rect width="1400" height="1300" fill="#f8fbfd"/>
  <text x="40" y="57" class="title">Prescription-refill agent</text>
  <text x="40" y="89" class="subtitle">Language helps interpretation. Verified server state authorizes every protected operation.</text>

  <rect x="340" y="120" width="1020" height="760" rx="22" fill="#eaf5f8" stroke="#b1cfd9" stroke-width="1.5"/>
  <text x="366" y="151" class="group-title">TRUSTED TYPESCRIPT SERVER · DEPENDENCIES COMPOSED IN runtime.ts</text>

  <!-- Connectors are drawn before cards so they never obscure their labels. -->
  <path d="M300 225 H370" class="flow"/>
  <path d="M570 280 V330" class="flow"/>
  <path d="M1070 280 V330" class="flow exchange"/>
  <path d="M370 383 H325 V550 H300" class="proposal"/>
  <path d="M1260 430 V454 H1345 V780 H1330" class="flow"/>
  <path d="M370 405 H350 V570 H370" class="flow"/>
  <path d="M645 570 H690" class="flow"/>
  <path d="M1000 570 H1040" class="flow"/>
  <path d="M1135 650 V685 H960 V710" class="flow"/>
  <path d="M1250 650 V710" class="flow"/>
  <path d="M980 780 H1030" class="flow"/>
  <path d="M1130 850 V900 H670 V930" class="flow"/>
  <path d="M1240 850 V930" class="flow"/>

  <rect x="40" y="160" width="260" height="205" rx="16" class="node"/>
  <text x="62" y="194" class="group-title">BROWSER · :5173</text>
  <text x="62" y="228" class="node-title">React + TypeScript</text>
  <text x="62" y="259" class="body">Typed conversation client</text>
  <text x="62" y="287" class="body">Node proxy → agent :5050</text>
  <text x="62" y="323" class="small">No service credentials</text>
  <text x="62" y="345" class="small">No clinical or write authority</text>

  <rect x="370" y="170" width="400" height="110" rx="14" class="node"/>
  <text x="392" y="202" class="node-title">Conversation HTTP API · :5050</text>
  <text x="392" y="230" class="code">POST /conversations/{id}/messages</text>
  <text x="392" y="256" class="small">GET /healthz · Zod validation · bounded input</text>

  <rect x="810" y="170" width="520" height="110" rx="14" class="node"/>
  <text x="832" y="202" class="node-title">Identity + session repository</text>
  <text x="832" y="230" class="body">Unique EHR match binds the patient; serialized turns</text>
  <text x="832" y="256" class="small">sessions.ts · identity.ts · expiry, replay and queue limits</text>

  <rect x="370" y="330" width="960" height="100" rx="14" class="node"/>
  <text x="392" y="364" class="node-title">Conversation engine + explicit state machine</text>
  <text x="392" y="392" class="body">Typed transitions, clarifications, cancellation and accurate terminal outcomes</text>
  <text x="392" y="416" class="small">workflow.ts · conversation-state.ts · optional LanguageInterpreter via llm-client.ts</text>
  <text x="1020" y="452" class="connector-label">identity match + protected reads</text>

  <rect x="40" y="465" width="260" height="190" rx="16" fill="#f1f5f8" stroke="#a8bdc8" stroke-width="1.5"/>
  <text x="62" y="499" class="group-title">EXTERNAL MODEL</text>
  <text x="62" y="533" class="node-title">Groq</text>
  <text x="62" y="563" class="code">openai/gpt-oss-120b</text>
  <text x="62" y="596" class="body">Schema-validated proposals</text>
  <text x="62" y="624" class="small">No patient IDs or tool authority</text>
  <text x="62" y="646" class="small">No clinical or consent decisions</text>

  <text x="370" y="470" class="group-title">DETERMINISTIC DOMAIN · AUTHENTICATED PATIENT CONTEXT ONLY</text>
  <rect x="370" y="490" width="275" height="160" rx="14" class="domain"/>
  <text x="390" y="525" class="node-title">Medication selection</text>
  <text x="390" y="556" class="body">Grounded in owned records</text>
  <text x="390" y="583" class="body">Ambiguity → clarification</text>
  <text x="390" y="610" class="small">selection.ts · clinical-workflow.ts</text>
  <text x="390" y="634" class="small">Never model-selected identifiers</text>

  <rect x="690" y="490" width="310" height="160" rx="14" class="domain"/>
  <text x="710" y="525" class="node-title">Clinical policy · R1–R4</text>
  <text x="710" y="554" class="small">R1 Schedule II · R2 refills / expiry</text>
  <text x="710" y="579" class="small">R3 controlled timing · R4 recent lab</text>
  <text x="710" y="608" class="body">Pure rules; authoritative EHR time</text>
  <text x="710" y="634" class="small">policy.ts · missing safety data blocks</text>

  <rect x="1040" y="490" width="290" height="160" rx="14" class="domain"/>
  <text x="1060" y="525" class="node-title">Pharmacy consent</text>
  <text x="1060" y="555" class="body">Exact medication + destination</text>
  <text x="1060" y="582" class="body">Explicit pending question</text>
  <text x="1060" y="609" class="small">Changes invalidate prior consent</text>
  <text x="1060" y="634" class="small">pharmacy-workflow.ts · scoped state</text>
  <text x="1135" y="704" class="connector-label">pharmacy PUT</text>

  <rect x="370" y="710" width="610" height="140" rx="14" fill="#dff2ec" stroke="#6ca896" stroke-width="2"/>
  <text x="392" y="746" class="node-title">Sole refill authorization kernel · actions.ts</text>
  <text x="392" y="777" class="body">Active identity + ownership + selection revision + exact consent</text>
  <text x="392" y="805" class="body">Fresh clinical checks → pending ledger → validated receipt</text>
  <text x="392" y="830" class="small">Repeated success reuses evidence; uncertain writes are never blindly retried</text>

  <rect x="1030" y="710" width="300" height="140" rx="14" class="node"/>
  <text x="1050" y="745" class="node-title">Service adapters</text>
  <text x="1050" y="775" class="body">Validated reads + guarded writes</text>
  <text x="1050" y="801" class="small">ehr-client.ts · clinical-ehr.ts</text>
  <text x="1050" y="827" class="small">pharmacy-client.ts · timeouts</text>

  <rect x="40" y="710" width="260" height="170" rx="16" fill="#fff8e9" stroke="#dcc48e" stroke-width="1.5"/>
  <text x="62" y="745" class="group-title" style="fill:#795f29">ASSESSMENT LIMITS</text>
  <text x="62" y="777" class="small">Session ID ≠ caller identity</text>
  <text x="62" y="803" class="small">State + ledger are in memory</text>
  <text x="62" y="829" class="small">No upstream idempotency</text>
  <text x="62" y="855" class="small">Read + write are not atomic</text>

  <text x="40" y="917" class="group-title">MOCK SERVICES · :4010</text>
  <text x="40" y="945" class="small">Server-side bearer credentials</text>
  <rect x="370" y="930" width="600" height="150" rx="16" class="node"/>
  <text x="392" y="966" class="node-title">EHR identity, clinical records and mutations</text>
  <text x="392" y="997" class="body">:match · medications · labs · /ehr/time</text>
  <text x="392" y="1027" class="body">GET / PUT patient pharmacy · POST patient refills</text>
  <text x="392" y="1056" class="small">Only session-bound patient IDs; response schemas validated at the boundary</text>

  <rect x="1010" y="930" width="320" height="150" rx="16" class="node"/>
  <text x="1032" y="966" class="node-title">Pharmacy directory</text>
  <text x="1032" y="997" class="code">GET /pharmacy/directory?q=…</text>
  <text x="1032" y="1027" class="body">Grounded pharmacy candidates</text>
  <text x="1032" y="1056" class="small">Separate service authorization</text>

  <rect x="40" y="1130" width="1320" height="110" rx="18" fill="#edf2fa" stroke="#bacbdf" stroke-width="1.5"/>
  <text x="64" y="1166" class="group-title">VERIFICATION · tests/ · conformance/ · evaluation/</text>
  <text x="64" y="1196" class="body">Unit and state tests → real mock integrations → adversarial conversations → unchanged official conformance</text>
  <text x="64" y="1222" class="small">Live Groq evaluation is opt-in and separate from deterministic tests; backend effects are asserted, not inferred from reply text.</text>
  <text x="40" y="1276" class="small">Submission is not dispensing. No clinician handoff API exists. Model interpretation never grants authorization.</text>
</svg>
