description = "Synthetic pharmacy token in the unchanged clinical integration fixture"
condition = "AND"
paths = ['''(?:^|/)tests/clinical-integration\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^synthetic-phase4-pharmacy$''']
